<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <style>
    	#list{
			display: inline-table;
    	}
		
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous" />
  </head>
  <body>
    
	<div class="container"><ul class="nav nav-pills">
    <li class="nav-item">
        <a class="nav-link " aria-current="page" href="index.html">Test Paese</a>
    </li>
    <li class="nav-item">
        <a class="nav-link " aria-current="page" href="index4.html">Trianing Paese</a>
    </li>
    <li class="nav-item">
        <a class="nav-link " aria-current="page" href="index6.html">Test Bandiera</a>
    </li>
    <li class="nav-item">
        <a class="nav-link " aria-current="page" href="index5.html">Trianing Bandiera</a>
    </li>
    <div class="container" >
        <h1>lo stato del paese</h1>
        <h1 id="country"></h1>
        <div id ="list"><p id="options"></p></div> 

      
    </div>
    <button onclick="fetchQuizData()">Nuova Scheda</button>
    <script >
     async function fetchQuizData() {

    	  try {
    	    const response = await fetch("/api/countries");
    	    const countries = await response.json();
    	    const random = Math.floor(Math.random() * countries.length);
			const rdn = Math.floor(Math.random() * (3 - 1) + 1);
    	    const country = countries[random];
    	    const worngCap = [];
    	    while(worngCap.length < 3){
    	      const worngInde = Math.floor(Math.random()*countries.length);
    	      if(worngInde !== random && countries[worngInde].capital){
    	        worngCap.push(countries[worngInde].capital);
			
    	      }
    	    }
    	    const correctCap = country.capital ;
			const option =worngCap;
    	    option[rdn] = correctCap
    	   
    	    document.getElementById('country').textContent = country.name;
    	    const opElement = document.getElementById('list');
    	    opElement.innerHTML = ' ';

    	    option.forEach(option =>{
    	      const button = document.createElement('button');
    	      button.className = 'option';
    	      button.textContent = option;
    	     // console.log(option);
    	      opElement.appendChild(button);
    	    });
    	  } catch (error ) {

    	    console.log('Errore nel recupro dei dati del quiz:', error);
    	    
    	  }
    	}

    	window.onLoad = fetchQuizData;

    </script>
    

  </body>
</html>
