    <div class="container" >
        <h1>lo stato del paese</h1>
        <h1 id="country"></h1>
        <img src="" id ="hello">
        <br>
        <button onclick="fetchCountryData()">Nuova Scheda</button>

      
    </div>

    <script>
   		async function fetchCountryData() {

    	  try {
    	    const response = await fetch("/api/countries");
    	    const countries = await response.json();
    	    const randomInd= Math.floor(Math.random() * countries.length);

    	    const country = countries[randomInd];
            
            const path = "./flags/"+country.alpha2code+".png";
//    	    document.getElementeById('country').textContent = country.name ;
//    	    document.getElementeById('capital').textContent = country.capital;
    	    document.getElementById('country').textContent = country.name;
            
            document.getElementById('hello').src = path;
    	  } catch (error) {
    	    console.error('Errore nel recipero dei  dati  del paese', error);
    	  }
    	}

    	window.onload = fetchCountryData;

    </script>
