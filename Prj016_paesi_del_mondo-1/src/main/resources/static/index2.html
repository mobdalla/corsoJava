<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paese e Capitale</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .container {
            text-align: center;
            padding: 20px;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="country">Nome del Paese</h1>
        <p id="capital">Capitale</p>
        <button onclick="fetchCountryData()">Avanti</button>
    </div>
    <script >
        async function fetchCountryData() {
    try {
        const response = await fetch('/api/countries');
        const countries = await response.json();
        const randomIndex = Math.floor(Math.random() * countries.length);
        const country = countries[randomIndex];

        document.getElementById('country').textContent = country.name;
        document.getElementById('capital').textContent = country.capital;
    } catch (error) {
        console.error('Errore nel recupero dei dati del paese:', error);
    }
}

// Carica un paese casuale quando la pagina viene caricata per la prima volta
window.onload = fetchCountryData;

    </script>
</body>
</html>
