<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Insert title here</title>
</head>
<body>
    <script>
        const URL = "/api/countries"
        fetch(URL)
            .then(res => res.json())
            .then(listaPokemon =>{
                for (const pokemon of listaPokemon){
                    const p = document.createElement('p')
                    p.textContent = pokemon.name
                    document.body.append(p)
                }
            })
        
    </script>

</body>
